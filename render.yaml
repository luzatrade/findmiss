# Deploy alternativo: https://render.com → New → Blueprint → repo findmiss
# Dopo il deploy: collega dominio api.findmiss.it al servizio web in Render → DNS

services:
  - type: web
    name: findmiss-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: node src/server.js
    healthCheckPath: /api/test
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: findmiss-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://findmiss.it,https://www.findmiss.it,https://findmiss.vercel.app

databases:
  - name: findmiss-db
    plan: free
    databaseName: findmiss
    user: findmiss
